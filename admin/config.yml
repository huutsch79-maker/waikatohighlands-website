# Sveltia CMS config — see https://github.com/sveltia/sveltia-cms
#
# Content shape here (a list of {key, heading, body, photo} per page) must
# stay in sync with src/content/config.ts's Zod schema and with the
# farm-website JARVIS module (waikatohighlands/src/modules/website/index.ts
# in the JARVIS repo) — all three read/write the exact same files.

backend:
  name: github
  repo: huutsch79-maker/waikatohighlands-website
  branch: main
  # Points the CMS's GitHub OAuth handshake at a self-hosted auth worker —
  # see README.md "GitHub OAuth login for /admin" for what to deploy and
  # why this can't just point at github.com directly. Uncomment once that
  # worker is deployed, with its actual URL:
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

media_folder: "src/assets/photos"
# No route serves src/assets/ directly (unlike the old public/photos/ setup)
# — those files only ever reach a browser through Astro's build-time image
# pipeline (see Hero.astro / PhotoBlock.astro), which is what fixed the
# pixelation/sharpness problem raw public/ serving had. One known
# consequence: this CMS's own media-library preview thumbnail won't
# resolve for images uploaded here, since public_folder has nowhere real
# to point it at. Not blocking (chat-driven edits via JARVIS don't go
# through this admin UI at all), but flagged as unfinished — same status
# as the OAuth login proxy above.
public_folder: "/photos"

collections:
  - name: pages
    label: Pages
    folder: "src/content/pages"
    format: json
    create: false # pages are added via JARVIS chat (website.addPage) or by hand — not from this list view
    delete: false
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string }
      - label: Sections
        name: sections
        widget: list
        summary: "{{fields.heading}} ({{fields.key}})"
        fields:
          - {
              label: "Key",
              name: key,
              widget: string,
              hint: "Unique id for this section, e.g. intro, mob-1 — don't change this once JARVIS or a page template references it.",
            }
          - { label: "Heading", name: heading, widget: string, required: false }
          - { label: "Body", name: body, widget: text }
          - {
              label: "Photo",
              name: photo,
              widget: string,
              required: false,
              hint: "Path relative to src/assets/photos/, no leading slash — e.g. farm/mob-1.jpg. Upload the file itself through the media library (the folder icon in this CMS), then paste its path here.",
            }
